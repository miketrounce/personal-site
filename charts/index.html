<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charts — South Africa</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1a1714; --surface: #2f2c28; --border: #45403a;
    --accent: #81b64c; --text: #f4f2ec; --muted: #7a7368;
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; min-height: 100vh; }
  .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }

  .back-link { display: inline-block; margin-bottom: 20px; color: var(--accent); text-decoration: none; font-size: 0.8rem; font-weight: 600; }
  .back-link:hover { text-decoration: underline; }

  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }

  /* ── Table ── */
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 10px 16px;
    border-bottom: 2px solid var(--border);
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
  }
  tbody tr:hover { background: var(--surface); }
  tbody td { padding: 14px 16px; vertical-align: middle; }

  .td-name { font-weight: 600; font-size: 0.9rem; color: var(--text); }
  .td-desc { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  .td-type {
    display: inline-block;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 3px 10px;
    border-radius: 4px;
    background: rgba(129,182,76,0.1);
    color: var(--accent);
  }
  .td-source { font-size: 0.7rem; color: var(--muted); }
  .td-preview { width: 120px; height: 60px; }
  .td-preview canvas { width: 100% !important; height: 100% !important; }

  /* ── Chart detail (expanded row) ── */
  .chart-detail { display: none; }
  .chart-detail.open { display: table-row; }
  .chart-detail td {
    padding: 24px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .chart-detail canvas { max-height: 50vh; }

  @media (max-width: 600px) {
    .td-preview { display: none; }
    thead th:last-child, tbody td:last-child { display: none; }
  }
</style>
</head>
<body>
<div class="container">
  <a href="/" class="back-link">&larr; Back</a>
  <h1>Charts</h1>
  <p class="sub">South African government bond market</p>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Type</th>
        <th>Source</th>
        <th>Preview</th>
      </tr>
    </thead>
    <tbody id="chart-table"></tbody>
  </table>
</div>

<script>
var API = 'https://api.miketrounce.com/api/series/';

// ── Shared helpers ──
function fanLabels(n) { var a=[]; for(var i=10;i<10+n;i++) a.push(String(i)); return a; }

function buildFanChart(canvas, title, yLabel, yMax, actuals, projections, negate) {
  var maxYear = Math.max.apply(null, Object.keys(projections).map(function(k){
    return Math.max.apply(null, Object.keys(projections[k]).map(Number));
  }));
  var allLabels = fanLabels(maxYear - 10 + 1);
  var actualData = allLabels.map(function(l){ var v = actuals[l]; return v != null ? (negate ? -v : v) : null; });
  var datasets = [{label:'Actual',data:actualData,borderColor:'#81b64c',borderWidth:3,pointBackgroundColor:'#81b64c',pointRadius:3,tension:0,spanGaps:false,order:0}];
  Object.keys(projections).forEach(function(vintage){
    var pv = projections[vintage];
    var d = allLabels.map(function(l){ var v = pv[l]; return v != null ? (negate ? -v : v) : null; });
    datasets.push({label:'Projection',data:d,borderColor:'rgba(244,242,236,0.2)',borderWidth:1,borderDash:[4,3],pointRadius:0,tension:0,spanGaps:false,order:1});
  });
  new Chart(canvas,{type:'line',data:{labels:allLabels,datasets:datasets},options:{responsive:true,maintainAspectRatio:true,aspectRatio:1.6,plugins:{legend:{display:false},title:{display:true,text:title,color:'#f4f2ec',font:{size:14,weight:'bold'}},tooltip:{filter:function(i){return i.raw!==null;},callbacks:{label:function(c){return c.dataset.label+': '+c.raw.toFixed(1)+'%';}}}},scales:{x:{ticks:{color:'#b8b0a4'},grid:{color:'rgba(69,64,58,0.5)'}},y:{min:0,max:yMax,ticks:{color:'#b8b0a4',callback:function(v){return v+'%';}},grid:{color:'rgba(69,64,58,0.5)'},title:{display:true,text:yLabel,color:'#7a7368',font:{weight:'bold'}}}}}});
}

// ── Chart registry — data fetched from API ──
var CHARTS = [
  {
    id: 'fan',
    name: 'Main Budget Deficit — Fan Chart',
    description: 'Deficit as % of GDP with projections from every National Budget Review (2011–2026)',
    type: 'Line',
    source: 'National Treasury',
    api: API + '?name=Main+budget+balance&projections=Main+budget+balance+(projection)',
    build: function(canvas, data) {
      var actuals = {}; data.labels.forEach(function(l,i){ actuals[l] = data.values[i]; });
      buildFanChart(canvas, 'Main Budget Deficit — % of GDP', 'Deficit %', 16, actuals, data.projections, true);
    }
  },
  {
    id: 'flow',
    name: 'Supply (Flow) — Deficit in ZAR & USD',
    description: 'Annual deficit in ZAR billions (bars) with % of GDP overlay.',
    type: 'Bar',
    source: 'National Treasury',
    api: null, // needs two series — fetched manually
    build: function(canvas) {
      Promise.all([
        fetch(API + '?name=Main+budget+deficit').then(function(r){return r.json();}),
        fetch(API + '?name=Main+budget+balance').then(function(r){return r.json();})
      ]).then(function(results) {
        var deficit = results[0], balance = results[1];
        var labels = deficit.labels;
        var zarBn = deficit.values.map(function(v){ return Math.round(v / 1000); });
        var pctGdp = balance.values.map(function(v){ return Math.abs(v); });
        new Chart(canvas,{type:'bar',data:{labels:labels,datasets:[{label:'ZAR bn',data:zarBn,backgroundColor:'rgba(129,182,76,0.7)',borderRadius:3,yAxisID:'y',order:1},{label:'% of GDP',data:pctGdp,type:'line',borderColor:'#81b64c',borderWidth:2,pointBackgroundColor:'#81b64c',pointRadius:3,tension:0,yAxisID:'y1',order:0}]},options:{responsive:true,maintainAspectRatio:true,aspectRatio:1.6,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},title:{display:true,text:'Main Budget Deficit — ZAR bn & % of GDP',color:'#f4f2ec',font:{size:14,weight:'bold'}},tooltip:{callbacks:{label:function(c){if(c.dataset.yAxisID==='y1')return c.raw.toFixed(1)+'% of GDP';return c.dataset.label+': '+c.raw;}}}},scales:{x:{ticks:{color:'#b8b0a4'},grid:{color:'rgba(69,64,58,0.5)'}},y:{position:'left',min:0,ticks:{color:'#81b64c'},grid:{color:'rgba(69,64,58,0.5)'},title:{display:true,text:'ZAR bn',color:'#81b64c',font:{weight:'bold'}}},y1:{position:'right',min:0,max:14,ticks:{color:'#81b64c',callback:function(v){return v+'%';}},grid:{drawOnChartArea:false},title:{display:true,text:'% of GDP',color:'#81b64c',font:{weight:'bold'}}}}}});
      });
    }
  },
  {
    id: 'debt',
    name: 'Gross Debt-to-GDP Ratio — Fan Chart',
    description: 'Gross loan debt as % of GDP with projections from every National Budget Review (2013–2026)',
    type: 'Line',
    source: 'National Treasury',
    api: API + '?name=Gross+debt-to-GDP+ratio&projections=Gross+debt-to-GDP+ratio+(projection)',
    build: function(canvas, data) {
      var actuals = {}; data.labels.forEach(function(l,i){ actuals[l] = data.values[i]; });
      buildFanChart(canvas, 'Gross Debt-to-GDP Ratio — %', 'Debt / GDP %', 90, actuals, data.projections, false);
    }
  }
];

// ── Build preview sparkline from API data ──
function buildPreview(canvasId, labels, values) {
  new Chart(document.getElementById(canvasId), {
    type: 'line',
    data: { labels: labels, datasets: [{ data: values.map(function(v){return Math.abs(v);}), borderColor: '#81b64c', borderWidth: 1.5, pointRadius: 0, tension: 0, fill: false }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: false }, title: { display: false }, tooltip: { enabled: false } },
      scales: { x: { display: false }, y: { display: false } }
    }
  });
}

// ── Build table ──
(function() {
  var tbody = document.getElementById('chart-table');

  CHARTS.forEach(function(chart) {
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td><div class="td-name">' + chart.name + '</div><div class="td-desc">' + chart.description + '</div></td>' +
      '<td><span class="td-type">' + chart.type + '</span></td>' +
      '<td class="td-source">' + chart.source + '</td>' +
      '<td class="td-preview"><canvas id="preview-' + chart.id + '"></canvas></td>';

    var detail = document.createElement('tr');
    detail.className = 'chart-detail';
    detail.id = 'detail-' + chart.id;
    detail.innerHTML = '<td colspan="4"><canvas id="full-' + chart.id + '"></canvas></td>';

    // Cache fetched data
    chart._data = null;
    chart._fetching = null;

    function fetchData() {
      if (chart._data) return Promise.resolve(chart._data);
      if (chart._fetching) return chart._fetching;
      if (!chart.api) return Promise.resolve(null);
      chart._fetching = fetch(chart.api).then(function(r){return r.json();}).then(function(d){
        chart._data = d;
        return d;
      });
      return chart._fetching;
    }

    // Fetch data for preview
    if (chart.api) {
      fetchData().then(function(data) {
        if (data) buildPreview('preview-' + chart.id, data.labels, data.values);
      });
    } else {
      // Flow chart: fetch deficit series for preview
      fetch(API + '?name=Main+budget+deficit').then(function(r){return r.json();}).then(function(d){
        buildPreview('preview-' + chart.id, d.labels, d.values.map(function(v){return v/1000;}));
      });
    }

    tr.addEventListener('click', function() {
      var isOpen = detail.classList.contains('open');
      document.querySelectorAll('.chart-detail').forEach(function(d) { d.classList.remove('open'); });
      if (!isOpen) {
        detail.classList.add('open');
        if (!detail._built) {
          detail._built = true;
          var canvas = document.getElementById('full-' + chart.id);
          if (chart.api) {
            fetchData().then(function(data) { chart.build(canvas, data); });
          } else {
            chart.build(canvas);
          }
        }
      }
    });

    tbody.appendChild(tr);
    tbody.appendChild(detail);
  });
})();
</script>
</body>
</html>
