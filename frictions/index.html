<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frictions — Mike Trounce</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2334312d'/><text x='50' y='68' font-family='Georgia,serif' font-size='52' font-weight='900' fill='%23f4f2ec' text-anchor='middle'>MT</text></svg>">
    <link rel="stylesheet" href="../styles.css" />
    <style>
      .page {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 40px 24px;
      }

      .content {
        width: 100%;
        max-width: 680px;
      }

      .back-link {
        display: inline-block;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--muted);
        text-decoration: none;
        margin-bottom: 40px;
        transition: color 0.15s;
      }

      .back-link:hover {
        color: var(--text);
      }

      .eyebrow {
        font-size: 0.65rem;
        color: var(--muted);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin: 0 0 8px;
      }

      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2.4rem;
        font-weight: 900;
        color: var(--text);
        margin: 0 0 16px;
        line-height: 1.15;
      }

      .subtitle {
        font-size: 1.05rem;
        color: var(--muted);
        line-height: 1.7;
        margin: 0 0 40px;
      }

      .divider {
        height: 1px;
        background: var(--border);
        margin: 40px 0;
      }

      .section-title {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1.3rem;
        font-weight: 900;
        color: var(--text);
        margin: 0 0 12px;
      }

      .section-text {
        font-size: 1.05rem;
        color: var(--muted);
        line-height: 1.7;
        margin: 0 0 24px;
      }

      .section-text:last-child {
        margin-bottom: 0;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .content {
        opacity: 0;
        animation: fadeInUp 0.5s ease 0.2s forwards;
      }

      /* ── Mobile ── */
      @media (max-width: 768px) {
        .page {
          padding: 32px 20px;
          align-items: flex-start;
        }

        h1 {
          font-size: 1.6rem;
        }

        .section-title {
          font-size: 1.1rem;
        }
      }
    </style>
  </head>
  <body>

    <main class="page">
      <div class="content">

        <a href="/" class="back-link">← Mike Trounce</a>

        <p class="eyebrow">Frictions</p>
        <h1>Supply, demand, flows and positions</h1>
        <p class="subtitle">How I look at markets.</p>

        <div class="divider"></div>

        <p class="section-text">Coming soon.</p>

      </div>
    </main>

  </body>
</html>
