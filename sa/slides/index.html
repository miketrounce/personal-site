<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slides — South Africa</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1a1714; --surface: #2f2c28; --border: #45403a;
    --accent: #81b64c; --text: #f4f2ec; --muted: #7a7368;
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; min-height: 100vh; }
  .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }

  .back-link { display: inline-block; margin-bottom: 20px; color: var(--accent); text-decoration: none; font-size: 0.8rem; font-weight: 600; }
  .back-link:hover { text-decoration: underline; }

  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }

  /* ── Table ── */
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 10px 16px;
    border-bottom: 2px solid var(--border);
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
  }
  tbody tr:hover { background: var(--surface); }
  tbody td { padding: 14px 16px; vertical-align: middle; }

  .td-name { font-weight: 600; font-size: 0.9rem; color: var(--text); }
  .td-desc { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  .td-type {
    display: inline-block;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 3px 10px;
    border-radius: 4px;
    background: rgba(129,182,76,0.1);
    color: var(--accent);
  }
  .td-chart { font-size: 0.7rem; color: var(--muted); }
  .td-status {
    display: inline-block;
    font-size: 0.55rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 4px;
  }
  .td-status.curated {
    background: rgba(129,182,76,0.15);
    color: var(--accent);
  }
  .td-status.draft {
    background: rgba(232,197,71,0.15);
    color: #e8c547;
  }

  /* ── Slide detail (expanded row) ── */
  .slide-detail { display: none; }
  .slide-detail.open { display: table-row; }
  .slide-detail td {
    padding: 24px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }

  /* ── Slide preview (mini slide layout) ── */
  .slide-preview {
    display: grid;
    grid-template-columns: 1fr 1.6fr;
    gap: 32px;
    align-items: start;
    max-width: 100%;
  }
  .slide-preview-text { display: flex; flex-direction: column; justify-content: flex-start; }
  .slide-preview-eyebrow {
    font-size: 10px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
  }
  .slide-preview-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.4rem; font-weight: 900; line-height: 1.15;
    color: var(--text); margin-bottom: 14px;
  }
  .slide-preview-bullets {
    list-style: none; display: flex; flex-direction: column; gap: 10px;
  }
  .slide-preview-bullets li {
    display: flex; align-items: flex-start; gap: 8px;
    font-size: 0.8rem; line-height: 1.5; color: #b8b0a4;
  }
  .slide-preview-bullets li::before {
    content: '\25B8'; color: var(--accent); flex-shrink: 0; margin-top: 1px; font-size: 12px;
  }
  .slide-preview-chart { display: flex; align-items: center; justify-content: center; }
  .slide-preview-chart canvas { max-height: 45vh; }

  @media (max-width: 768px) {
    .slide-preview { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <a href="/" class="back-link">&larr; Back</a>
  <h1>Slides</h1>
  <p class="sub">Analyst-curated — chart + commentary, one point per slide</p>

  <table>
    <thead>
      <tr>
        <th>Slide</th>
        <th>Chart</th>
        <th>Status</th>
        <th>Bullets</th>
      </tr>
    </thead>
    <tbody id="slide-table"></tbody>
  </table>
</div>

<script src="../slides.js"></script>
<script>
(function() {
  var tbody = document.getElementById('slide-table');

  SLIDE_DATA.forEach(function(slide) {
    var tr = document.createElement('tr');
    var statusClass = slide.curated ? 'curated' : 'draft';
    var statusLabel = slide.curated ? 'Curated' : 'AI Draft';
    tr.innerHTML =
      '<td><div class="td-name">' + slide.title + '</div><div class="td-desc">' + slide.description + '</div></td>' +
      '<td><span class="td-type">' + slide.chartName + '</span></td>' +
      '<td><span class="td-status ' + statusClass + '">' + statusLabel + '</span></td>' +
      '<td class="td-chart">' + slide.bullets.length + ' points</td>';

    var detail = document.createElement('tr');
    detail.className = 'slide-detail';
    detail.innerHTML = '<td colspan="4">' +
      '<div class="slide-preview">' +
      '<div class="slide-preview-text">' +
      '<p class="slide-preview-eyebrow">' + slide.eyebrow + '</p>' +
      '<h2 class="slide-preview-title">' + slide.title + '</h2>' +
      '<ul class="slide-preview-bullets">' +
      slide.bullets.map(function(b) { return '<li>' + b + '</li>'; }).join('') +
      '</ul></div>' +
      '<div class="slide-preview-chart"><canvas id="slide-' + slide.id + '"></canvas></div>' +
      '</div></td>';

    tr.addEventListener('click', function() {
      var isOpen = detail.classList.contains('open');
      document.querySelectorAll('.slide-detail').forEach(function(d) { d.classList.remove('open'); });
      if (!isOpen) {
        detail.classList.add('open');
        if (!detail._built) {
          detail._built = true;
          slide.buildChart(document.getElementById('slide-' + slide.id));
        }
      }
    });

    tbody.appendChild(tr);
    tbody.appendChild(detail);
  });
})();
</script>
</body>
</html>
