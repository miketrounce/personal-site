<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charts — South Africa</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #1a1714; --surface: #2f2c28; --border: #45403a;
    --accent: #81b64c; --text: #f4f2ec; --muted: #7a7368;
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; min-height: 100vh; }
  .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }

  .back-link { display: inline-block; margin-bottom: 20px; color: var(--accent); text-decoration: none; font-size: 0.8rem; font-weight: 600; }
  .back-link:hover { text-decoration: underline; }

  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }

  /* ── Table ── */
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 10px 16px;
    border-bottom: 2px solid var(--border);
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
  }
  tbody tr:hover { background: var(--surface); }
  tbody td { padding: 14px 16px; vertical-align: middle; }

  .td-name { font-weight: 600; font-size: 0.9rem; color: var(--text); }
  .td-desc { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  .td-type {
    display: inline-block;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 3px 10px;
    border-radius: 4px;
    background: rgba(129,182,76,0.1);
    color: var(--accent);
  }
  .td-source { font-size: 0.7rem; color: var(--muted); }
  .td-preview { width: 120px; height: 60px; }
  .td-preview canvas { width: 100% !important; height: 100% !important; }

  /* ── Chart detail (expanded row) ── */
  .chart-detail { display: none; }
  .chart-detail.open { display: table-row; }
  .chart-detail td {
    padding: 24px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .chart-detail canvas { max-height: 50vh; }

  /* ── Mode toggle ── */
  .mode-toggle {
    display: inline-flex;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .mode-toggle button {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 6px 16px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .mode-toggle button.active {
    background: var(--accent);
    color: #1a1714;
  }
  .mode-toggle button:not(.active):hover {
    background: rgba(129,182,76,0.1);
    color: var(--text);
  }

  /* ── Animated controls ── */
  .anim-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
  }
  .anim-controls button {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 700;
    padding: 6px 14px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .anim-controls button:hover { border-color: var(--accent); }
  .anim-vintage {
    font-size: 0.7rem;
    color: var(--muted);
    font-weight: 600;
  }

  @media (max-width: 600px) {
    .td-preview { display: none; }
    thead th:last-child, tbody td:last-child { display: none; }
  }
</style>
</head>
<body>
<div class="container">
  <a href="/" class="back-link">&larr; Back</a>
  <h1>Charts</h1>
  <p class="sub">South African government bond market</p>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Type</th>
        <th>Source</th>
        <th>Preview</th>
      </tr>
    </thead>
    <tbody id="chart-table"></tbody>
  </table>
</div>

<script>
var API = 'https://api.miketrounce.com/api/series/';

// ── Chart data: add entries here to create new charts ──
// Every chart is purely declarative. Only these fields change.
//
//   chart:        'fan' | 'line' | 'bar' | 'combo' | 'signed-bar'
//   series:       string (series name) or [string, string] for combo charts
//   projections:  projection series name (fan charts only)
//   negate:       flip sign of values (fan charts only, for deficit-as-positive)
//   title:        chart title shown above the chart
//   yLabel:       y-axis label
//   yMax/yMin:    y-axis bounds (optional)
//   unit:         '%' | 'ZAR mn' | 'ZAR bn' — controls tick/tooltip formatting
//   transform:    'abs' | '/1000' — transform values before display
//   fill:         true to fill area under line
//   color:        primary color (default: accent green)
//   color2:       second series color (combo charts)
//   previewSeries: series name for preview when different from primary series

var CHARTS = [
  {
    id: 'fan',
    name: 'Main Budget Deficit — Fan Chart',
    description: 'Deficit as % of GDP with projections from every National Budget Review (2011–2026)',
    chart: 'fan',
    source: 'National Treasury',
    series: 'Main budget balance',
    projections: 'Main budget balance (projection)',
    title: 'Main Budget Deficit — % of GDP',
    yLabel: 'Deficit %',
    yMax: 16,
    negate: true,
    animated: true
  },
  {
    id: 'flow',
    name: 'Supply (Flow) — Deficit in ZAR & USD',
    description: 'Annual deficit in ZAR billions (bars) with % of GDP overlay.',
    chart: 'combo',
    source: 'National Treasury',
    series: ['Main budget deficit', 'Main budget balance'],
    title: 'Main Budget Deficit — ZAR bn & % of GDP',
    bar:  { label: 'ZAR bn',   index: 0, transform: '/1000', yLabel: 'ZAR bn',    unit: 'ZAR bn' },
    line: { label: '% of GDP', index: 1, transform: 'abs',   yLabel: '% of GDP',  unit: '%', yMax: 14 },
    previewSeries: 'Main budget deficit'
  },
  {
    id: 'debt',
    name: 'Gross Debt-to-GDP Ratio — Fan Chart',
    description: 'Gross loan debt as % of GDP with projections from every National Budget Review (2013–2026)',
    chart: 'fan',
    source: 'National Treasury',
    series: 'Gross debt-to-GDP ratio',
    projections: 'Gross debt-to-GDP ratio (projection)',
    title: 'Gross Debt-to-GDP Ratio — %',
    yLabel: 'Debt / GDP %',
    yMax: 90,
    negate: false,
    animated: true
  },
  {
    id: 'foreign',
    name: 'Foreign Holdings of Government Bonds',
    description: 'Non-resident share of outstanding government bonds (% of total)',
    chart: 'line',
    source: 'National Treasury',
    series: 'Foreign holdings of government bonds',
    title: 'Foreign Holdings — % of Total Outstanding',
    yLabel: '% of total',
    yMax: 40,
    unit: '%',
    fill: true
  },
  {
    id: 'loandebt',
    name: 'Gross Loan Debt',
    description: 'Total gross loan debt of national government in ZAR billions',
    chart: 'bar',
    source: 'National Treasury',
    series: 'Gross loan debt of national government',
    title: 'Gross Loan Debt — ZAR bn',
    yLabel: 'ZAR billions',
    unit: 'ZAR bn',
    transform: '/1000'
  },
  {
    id: 'debtcombo',
    name: 'Debt Level vs Debt-to-GDP',
    description: 'Gross loan debt (ZAR bn) alongside debt-to-GDP ratio (%)',
    chart: 'combo',
    source: 'National Treasury',
    series: ['Gross loan debt of national government', 'Gross debt-to-GDP ratio'],
    title: 'Gross Loan Debt & Debt-to-GDP Ratio',
    bar:  { label: 'ZAR bn',     index: 0, transform: '/1000', yLabel: 'ZAR bn',       unit: 'ZAR bn' },
    line: { label: 'Debt/GDP %', index: 1,                     yLabel: 'Debt / GDP %',  unit: '%', yMax: 90, color: '#e8c547' },
    previewSeries: 'Gross loan debt of national government'
  },
  {
    id: 'sabo',
    name: 'Net Foreign Bond Flows — Daily',
    description: 'Daily net foreign purchases of SA government bonds (Bloomberg SABO Index)',
    chart: 'signed-bar',
    source: 'Bloomberg',
    series: 'SA Net Bond Sales to Foreigners',
    title: 'SABO Index — Daily Net Foreign Bond Purchases',
    yLabel: 'ZAR millions',
    unit: 'ZAR mn'
  }
];

// ── Generic chart builders ──
var theme = {
  text: '#f4f2ec', muted: '#b8b0a4', grid: 'rgba(69,64,58,0.5)',
  accent: '#81b64c', negative: '#cc4444',
  base: { responsive: true, maintainAspectRatio: true, aspectRatio: 1.6 }
};

function applyTransform(values, transform) {
  if (!transform) return values;
  if (transform === '/1000') return values.map(function(v) { return Math.round(v / 1000); });
  if (transform === 'abs')   return values.map(function(v) { return Math.abs(v); });
  return values;
}

function formatTick(unit) {
  if (unit === '%')      return function(v) { return v + '%'; };
  if (unit === 'ZAR bn') return function(v) { return 'R' + v + ' bn'; };
  if (unit === 'ZAR mn') return function(v) { return v / 1000 + 'k'; };
  return function(v) { return v; };
}

function formatTooltip(unit) {
  if (unit === '%')      return function(c) { return c.raw.toFixed(1) + '%'; };
  if (unit === 'ZAR bn') return function(c) { return 'R' + c.raw + ' bn'; };
  if (unit === 'ZAR mn') return function(c) { return (c.raw >= 0 ? '+' : '') + Math.round(c.raw) + ' ZAR mn'; };
  return function(c) { return c.raw; };
}

function yScale(cfg) {
  var s = {
    ticks: { color: cfg.tickColor || theme.muted, callback: formatTick(cfg.unit) },
    grid: { color: cfg.grid !== false ? theme.grid : undefined, drawOnChartArea: cfg.grid !== false },
    title: { display: !!cfg.label, text: cfg.label, color: cfg.titleColor || theme.muted, font: { weight: 'bold' } }
  };
  if (cfg.min != null) s.min = cfg.min;
  if (cfg.max != null) s.max = cfg.max;
  if (cfg.position) s.position = cfg.position;
  return s;
}

var BUILDERS = {
  fan: function(canvas, cfg, datasets) {
    var data = datasets[0];
    var actuals = {};
    data.labels.forEach(function(l, i) { actuals[l] = data.values[i]; });
    var maxYear = Math.max.apply(null, Object.keys(data.projections).map(function(k) {
      return Math.max.apply(null, Object.keys(data.projections[k]).map(Number));
    }));
    var allLabels = [];
    for (var i = 10; i <= maxYear; i++) allLabels.push(String(i));
    var actualData = allLabels.map(function(l) {
      var v = actuals[l]; return v != null ? (cfg.negate ? -v : v) : null;
    });
    var ds = [{ label: 'Actual', data: actualData, borderColor: theme.accent, borderWidth: 3,
      pointBackgroundColor: theme.accent, pointRadius: 3, tension: 0, spanGaps: false, order: 0 }];
    Object.keys(data.projections).forEach(function(vintage) {
      var pv = data.projections[vintage];
      var d = allLabels.map(function(l) { var v = pv[l]; return v != null ? (cfg.negate ? -v : v) : null; });
      ds.push({ label: 'Projection', data: d, borderColor: 'rgba(244,242,236,0.2)', borderWidth: 1,
        borderDash: [4, 3], pointRadius: 0, tension: 0, spanGaps: false, order: 1 });
    });
    new Chart(canvas, { type: 'line', data: { labels: allLabels, datasets: ds }, options: {
      responsive: true, maintainAspectRatio: true, aspectRatio: 1.6,
      plugins: { legend: { display: false },
        title: { display: true, text: cfg.title, color: theme.text, font: { size: 14, weight: 'bold' } },
        tooltip: { filter: function(i) { return i.raw !== null; },
          callbacks: { label: function(c) { return c.dataset.label + ': ' + c.raw.toFixed(1) + '%'; } } } },
      scales: { x: { ticks: { color: theme.muted }, grid: { color: theme.grid } },
        y: yScale({ min: 0, max: cfg.yMax, unit: '%', label: cfg.yLabel }) }
    }});
  },

  'fan-animated': function(canvas, cfg, datasets) {
    var data = datasets[0];
    var actuals = {};
    data.labels.forEach(function(l, i) { actuals[l] = data.values[i]; });
    var vintageKeys = Object.keys(data.projections).sort();
    var maxYear = Math.max.apply(null, vintageKeys.map(function(k) {
      return Math.max.apply(null, Object.keys(data.projections[k]).map(Number));
    }));
    var allLabels = [];
    for (var i = 10; i <= maxYear; i++) allLabels.push(String(i));
    var actualData = allLabels.map(function(l) {
      var v = actuals[l]; return v != null ? (cfg.negate ? -v : v) : null;
    });

    var chart = new Chart(canvas, { type: 'line', data: { labels: allLabels, datasets: [
      { label: 'Actual', data: actualData, borderColor: theme.accent, borderWidth: 3,
        pointBackgroundColor: theme.accent, pointRadius: 3, tension: 0, spanGaps: false, order: 0 }
    ]}, options: {
      responsive: true, maintainAspectRatio: true, aspectRatio: 1.6,
      animation: { duration: 400 },
      plugins: { legend: { display: false },
        title: { display: true, text: cfg.title, color: theme.text, font: { size: 14, weight: 'bold' } },
        tooltip: { filter: function(i) { return i.raw !== null; },
          callbacks: { label: function(c) { return c.dataset.label + ': ' + c.raw.toFixed(1) + '%'; } } } },
      scales: { x: { ticks: { color: theme.muted }, grid: { color: theme.grid } },
        y: yScale({ min: 0, max: cfg.yMax, unit: '%', label: cfg.yLabel }) }
    }});

    var currentIdx = 0;
    var timer = null;
    var controls = canvas.parentNode.querySelector('.anim-controls');
    var vintageLabel = controls.querySelector('.anim-vintage');
    var playBtn = controls.querySelector('.anim-play');
    var stepBtn = controls.querySelector('.anim-step');
    var resetBtn = controls.querySelector('.anim-reset');

    function addVintage(idx) {
      if (idx >= vintageKeys.length) { stopPlay(); return; }
      var vintage = vintageKeys[idx];
      var pv = data.projections[vintage];
      var d = allLabels.map(function(l) { var v = pv[l]; return v != null ? (cfg.negate ? -v : v) : null; });
      chart.data.datasets.push({ label: vintage, data: d, borderColor: 'rgba(244,242,236,0.25)', borderWidth: 1,
        borderDash: [4, 3], pointRadius: 0, tension: 0, spanGaps: false, order: 1 });
      chart.update();
      currentIdx = idx + 1;
      vintageLabel.textContent = 'Budget ' + vintage + '  (' + currentIdx + '/' + vintageKeys.length + ')';
    }

    function startPlay() {
      if (currentIdx >= vintageKeys.length) { resetAll(); }
      playBtn.textContent = '⏸ Pause';
      timer = setInterval(function() {
        if (currentIdx >= vintageKeys.length) { stopPlay(); return; }
        addVintage(currentIdx);
      }, 600);
    }

    function stopPlay() {
      clearInterval(timer); timer = null;
      playBtn.textContent = '▶ Play';
    }

    function resetAll() {
      stopPlay();
      chart.data.datasets = [chart.data.datasets[0]];
      chart.update();
      currentIdx = 0;
      vintageLabel.textContent = '';
    }

    playBtn.addEventListener('click', function() { timer ? stopPlay() : startPlay(); });
    stepBtn.addEventListener('click', function() { stopPlay(); if (currentIdx < vintageKeys.length) addVintage(currentIdx); });
    resetBtn.addEventListener('click', resetAll);
    controls.style.display = 'flex';
  },

  line: function(canvas, cfg, datasets) {
    var data = datasets[0];
    var color = cfg.color || theme.accent;
    var values = applyTransform(data.values, cfg.transform);
    var fillOpt = cfg.fill ? { target: 'origin', backgroundColor: color.replace(')', ',0.1)').replace('rgb(', 'rgba(') } : false;
    if (cfg.fill && color === theme.accent) fillOpt = { target: 'origin', backgroundColor: 'rgba(129,182,76,0.1)' };
    new Chart(canvas, { type: 'line', data: { labels: data.labels, datasets: [{
      label: cfg.name, data: values, borderColor: color, borderWidth: 3,
      pointBackgroundColor: color, pointRadius: 3, tension: 0, fill: fillOpt }] }, options: {
      responsive: true, maintainAspectRatio: true, aspectRatio: 1.6,
      plugins: { legend: { display: false },
        title: { display: true, text: cfg.title, color: theme.text, font: { size: 14, weight: 'bold' } },
        tooltip: { callbacks: { label: formatTooltip(cfg.unit) } } },
      scales: { x: { ticks: { color: theme.muted }, grid: { color: theme.grid } },
        y: yScale({ min: cfg.yMin || 0, max: cfg.yMax, unit: cfg.unit, label: cfg.yLabel }) }
    }});
  },

  bar: function(canvas, cfg, datasets) {
    var data = datasets[0];
    var values = applyTransform(data.values, cfg.transform);
    new Chart(canvas, { type: 'bar', data: { labels: data.labels, datasets: [{
      label: cfg.name, data: values, backgroundColor: 'rgba(129,182,76,0.7)', borderRadius: 3 }] }, options: {
      responsive: true, maintainAspectRatio: true, aspectRatio: 1.6,
      plugins: { legend: { display: false },
        title: { display: true, text: cfg.title, color: theme.text, font: { size: 14, weight: 'bold' } },
        tooltip: { callbacks: { label: formatTooltip(cfg.unit) } } },
      scales: { x: { ticks: { color: theme.muted }, grid: { color: theme.grid } },
        y: yScale({ min: 0, max: cfg.yMax, unit: cfg.unit, label: cfg.yLabel }) }
    }});
  },

  'signed-bar': function(canvas, cfg, datasets) {
    var data = datasets[0];
    var colors = data.values.map(function(v) { return v >= 0 ? 'rgba(129,182,76,0.7)' : 'rgba(204,68,68,0.7)'; });
    new Chart(canvas, { type: 'bar', data: { labels: data.labels, datasets: [{
      label: cfg.name, data: data.values, backgroundColor: colors, borderRadius: 0,
      barPercentage: 1.0, categoryPercentage: 1.0 }] }, options: {
      responsive: true, maintainAspectRatio: true, aspectRatio: 1.6,
      plugins: { legend: { display: false },
        title: { display: true, text: cfg.title, color: theme.text, font: { size: 14, weight: 'bold' } },
        tooltip: { callbacks: { label: formatTooltip(cfg.unit) } } },
      scales: { x: { ticks: { color: theme.muted, maxTicksLimit: 12 }, grid: { color: theme.grid } },
        y: yScale({ unit: cfg.unit, label: cfg.yLabel }) }
    }});
  },

  combo: function(canvas, cfg, datasets) {
    var b = cfg.bar, l = cfg.line;
    var barColor = b.color || theme.accent;
    var lineColor = l.color || theme.accent;
    var barVals = applyTransform(datasets[b.index].values, b.transform);
    var lineVals = applyTransform(datasets[l.index].values, l.transform);
    var axisTopLabels = {
      id: 'axisTopLabels',
      afterDraw: function(chart) {
        var ctx = chart.ctx;
        var yLeft = chart.scales.y;
        var yRight = chart.scales.y1;
        ctx.save();
        ctx.font = 'bold 11px -apple-system, system-ui, sans-serif';
        ctx.textBaseline = 'bottom';
        ctx.fillStyle = barColor;
        ctx.textAlign = 'left';
        ctx.fillText(b.yLabel, yLeft.left, yLeft.top - 8);
        ctx.fillStyle = lineColor;
        ctx.textAlign = 'right';
        ctx.fillText(l.yLabel, yRight.right, yRight.top - 8);
        ctx.restore();
      }
    };
    new Chart(canvas, { type: 'bar', data: { labels: datasets[0].labels, datasets: [
      { label: b.label, data: barVals, backgroundColor: barColor.indexOf('rgba') === 0 ? barColor : barColor.replace(')', ',0.7)').replace('rgb(', 'rgba('),
        borderRadius: 3, yAxisID: 'y', order: 1 },
      { label: l.label, data: lineVals, type: 'line', borderColor: lineColor, borderWidth: 2,
        pointBackgroundColor: lineColor, pointRadius: 3, tension: 0, yAxisID: 'y1', order: 0 }
    ]}, options: {
      responsive: true, maintainAspectRatio: true, aspectRatio: 1.6,
      layout: { padding: { top: 20 } },
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false },
        title: { display: true, text: cfg.title, color: theme.text, font: { size: 14, weight: 'bold' } },
        tooltip: { callbacks: { label: function(c) {
          if (c.dataset.yAxisID === 'y1') return formatTooltip(l.unit)(c);
          return formatTooltip(b.unit)(c);
        }}}},
      scales: { x: { ticks: { color: theme.muted }, grid: { color: theme.grid } },
        y:  yScale({ position: 'left',  min: 0, max: b.yMax, unit: b.unit, tickColor: barColor }),
        y1: yScale({ position: 'right', min: 0, max: l.yMax, unit: l.unit, tickColor: lineColor, grid: false }) }
    }, plugins: [axisTopLabels] });
  }
};

// ── Fetch helpers ──
function seriesUrl(name) { return API + '?name=' + encodeURIComponent(name); }

function fetchSeries(cfg) {
  var names = typeof cfg.series === 'string' ? [cfg.series] : cfg.series;
  var urls = names.map(function(n) { return seriesUrl(n); });
  if (cfg.projections) urls[0] += '&projections=' + encodeURIComponent(cfg.projections);
  return Promise.all(urls.map(function(u) { return fetch(u).then(function(r) { return r.json(); }); }));
}

// ── Build preview sparkline ──
function buildPreview(canvasId, labels, values) {
  new Chart(document.getElementById(canvasId), {
    type: 'line',
    data: { labels: labels, datasets: [{ data: values.map(function(v) { return Math.abs(v); }),
      borderColor: '#81b64c', borderWidth: 1.5, pointRadius: 0, tension: 0, fill: false }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: false }, title: { display: false }, tooltip: { enabled: false } },
      scales: { x: { display: false }, y: { display: false } }
    }
  });
}

// ── Build table ──
(function() {
  var tbody = document.getElementById('chart-table');
  var typeLabels = { fan: 'Fan', line: 'Line', bar: 'Bar', 'signed-bar': 'Bar', combo: 'Combo' };

  CHARTS.forEach(function(cfg) {
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td><div class="td-name">' + cfg.name + '</div><div class="td-desc">' + cfg.description + '</div></td>' +
      '<td><span class="td-type">' + (typeLabels[cfg.chart] || cfg.chart) + '</span></td>' +
      '<td class="td-source">' + cfg.source + '</td>' +
      '<td class="td-preview"><canvas id="preview-' + cfg.id + '"></canvas></td>';

    var detail = document.createElement('tr');
    detail.className = 'chart-detail';
    detail.id = 'detail-' + cfg.id;

    var detailHTML = '<td colspan="4">';
    if (cfg.animated) {
      detailHTML += '<div class="mode-toggle">' +
        '<button class="mode-btn active" data-mode="static">Static</button>' +
        '<button class="mode-btn" data-mode="animated">Animated</button></div>';
    }
    detailHTML += '<div class="chart-pane chart-pane-static"><canvas id="full-' + cfg.id + '"></canvas></div>';
    if (cfg.animated) {
      detailHTML += '<div class="chart-pane chart-pane-animated" style="display:none;">' +
        '<canvas id="anim-' + cfg.id + '"></canvas>' +
        '<div class="anim-controls" style="display:none;">' +
        '<button class="anim-play">▶ Play</button>' +
        '<button class="anim-step">Step →</button>' +
        '<button class="anim-reset">Reset</button>' +
        '<span class="anim-vintage"></span></div></div>';
    }
    detailHTML += '</td>';
    detail.innerHTML = detailHTML;

    cfg._data = null;
    cfg._fetching = null;

    function fetchData() {
      if (cfg._data) return Promise.resolve(cfg._data);
      if (cfg._fetching) return cfg._fetching;
      cfg._fetching = fetchSeries(cfg).then(function(d) { cfg._data = d; return d; });
      return cfg._fetching;
    }

    // Toggle handling
    if (cfg.animated) {
      var btns = detail.querySelectorAll('.mode-btn');
      var staticPane = detail.querySelector('.chart-pane-static');
      var animPane = detail.querySelector('.chart-pane-animated');
      var animBuilt = false;
      btns.forEach(function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          btns.forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');
          if (btn.dataset.mode === 'static') {
            staticPane.style.display = '';
            animPane.style.display = 'none';
          } else {
            staticPane.style.display = 'none';
            animPane.style.display = '';
            if (!animBuilt) {
              animBuilt = true;
              fetchData().then(function(datasets) {
                BUILDERS['fan-animated'](document.getElementById('anim-' + cfg.id), cfg, datasets);
              });
            }
          }
        });
      });
    }

    // Preview: use previewSeries if specified, otherwise first series
    var previewName = cfg.previewSeries || (typeof cfg.series === 'string' ? cfg.series : cfg.series[0]);
    fetch(seriesUrl(previewName)).then(function(r) { return r.json(); }).then(function(d) {
      var vals = cfg.transform === '/1000' ? d.values.map(function(v) { return v / 1000; }) : d.values;
      buildPreview('preview-' + cfg.id, d.labels, vals);
    });

    tr.addEventListener('click', function() {
      var isOpen = detail.classList.contains('open');
      document.querySelectorAll('.chart-detail').forEach(function(d) { d.classList.remove('open'); });
      if (!isOpen) {
        detail.classList.add('open');
        if (!detail._built) {
          detail._built = true;
          fetchData().then(function(datasets) {
            BUILDERS[cfg.chart](document.getElementById('full-' + cfg.id), cfg, datasets);
          });
        }
      }
    });

    tbody.appendChild(tr);
    tbody.appendChild(detail);
  });
})();
</script>
</body>
</html>
