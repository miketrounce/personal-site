<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>South Africa — Deck</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2334312d'/><text x='50' y='68' font-family='Georgia,serif' font-size='52' font-weight='900' fill='%23f4f2ec' text-anchor='middle'>MT</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #2b2926; --surface: #34312d; --border: #45403a;
    --accent: #81b64c; --text: #f4f2ec; --muted: #b8b0a4;
    --picker-bg: #1a1714; --picker-surface: #2f2c28; --picker-muted: #7a7368;
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; margin: 0; }

  /* ══════════════════════════════════════════════════
     PICKER MODE
     ══════════════════════════════════════════════════ */
  .picker-wrap { display: none; background: var(--picker-bg); min-height: 100vh; }
  .picker-wrap.active { display: block; }
  .picker-container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }

  .picker-container .back-link { display: inline-block; margin-bottom: 20px; color: var(--accent); text-decoration: none; font-size: 0.8rem; font-weight: 600; }
  .picker-container .back-link:hover { text-decoration: underline; }

  .picker-container h1 { font-size: 1.6rem; margin-bottom: 4px; }
  .picker-container .sub { color: var(--picker-muted); font-size: 0.85rem; margin-bottom: 24px; }

  .picker-container table { width: 100%; border-collapse: collapse; }
  .picker-container thead th {
    text-align: left; font-size: 0.6rem; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--picker-muted); padding: 10px 16px;
    border-bottom: 2px solid var(--border);
  }
  .picker-container tbody tr {
    border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background 0.15s;
  }
  .picker-container tbody tr:hover { background: var(--picker-surface); }
  .picker-container tbody td { padding: 14px 16px; vertical-align: middle; }
  .picker-container .td-name { font-weight: 600; font-size: 0.9rem; color: var(--text); }
  .picker-container .td-desc { font-size: 0.75rem; color: var(--picker-muted); margin-top: 2px; }
  .picker-container .td-count {
    display: inline-block; font-size: 0.6rem; font-weight: 700;
    letter-spacing: 0.06em; padding: 3px 10px; border-radius: 4px;
    background: rgba(129,182,76,0.1); color: var(--accent);
  }
  .picker-container .td-arrow { color: var(--picker-muted); font-size: 1.1rem; text-align: right; }

  /* ══════════════════════════════════════════════════
     DECK MODE (presentation)
     ══════════════════════════════════════════════════ */
  .deck-wrap { display: none; height: 100vh; flex-direction: column; overflow: hidden; user-select: none; }
  .deck-wrap.active { display: flex; }

  #progress { height: 3px; background: var(--border); position: fixed; top: 0; left: 0; right: 0; z-index: 100; }
  #progress-fill { height: 100%; background: var(--accent); transition: width 0.4s ease; }

  #deck { flex: 1; position: relative; overflow: hidden; }

  .slide {
    position: absolute; inset: 0;
    display: flex; justify-content: center; align-items: center;
    padding: 48px 32px;
    opacity: 0; transform: translateX(60px);
    transition: opacity 0.45s ease, transform 0.45s ease;
    pointer-events: none;
  }
  .slide.active { opacity: 1; transform: translateX(0); pointer-events: all; }
  .slide.exit { opacity: 0; transform: translateX(-60px); }

  .slide-inner {
    display: grid; grid-template-columns: 1fr 1.6fr; gap: 32px;
    align-items: center; width: 100%; max-width: 960px;
  }
  .col-text { display: flex; flex-direction: column; justify-content: center; }
  .col-chart { display: flex; align-items: center; justify-content: center; }
  .col-chart canvas { max-height: 60vh; }

  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  .slide-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(22px, 3vw, 38px); font-weight: 900; line-height: 1.15;
    color: var(--text); margin-bottom: 16px;
  }
  .bullets { list-style: none; display: flex; flex-direction: column; gap: 12px; }
  .bullets li {
    display: flex; align-items: flex-start; gap: 10px;
    font-size: clamp(14px, 1.6vw, 17px); line-height: 1.5; color: #b8b0a4;
    opacity: 0; transform: translateY(10px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .bullets li.visible { opacity: 1; transform: translateY(0); }
  .bullets li::before { content: '\25B8'; color: var(--accent); flex-shrink: 0; margin-top: 2px; font-size: 12px; }

  #nav {
    display: flex; align-items: center; justify-content: center; gap: 24px;
    padding: 16px 32px; background: var(--surface); border-top: 1px solid var(--border);
  }
  .nav-btn {
    background: none; border: 1px solid var(--border); color: var(--text);
    padding: 8px 22px; border-radius: 8px; font-size: 14px; cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }
  .nav-btn:hover { background: var(--border); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .dot-row { display: flex; gap: 8px; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); cursor: pointer; transition: background 0.2s, transform 0.2s; }
  .dot.active { background: var(--accent); transform: scale(1.3); }
  #slide-counter { font-size: 13px; color: var(--muted); min-width: 60px; text-align: center; }
  #hint { position: fixed; bottom: 72px; right: 20px; font-size: 11px; color: var(--muted); opacity: 0.6; }

  @media (max-width: 768px) {
    .slide { padding: 24px 16px; }
    .slide-inner { grid-template-columns: 1fr; }
    .bullets li { font-size: 14px; }
  }
</style>
</head>
<body>

<!-- ═══ PICKER MODE ═══ -->
<div class="picker-wrap" id="picker-wrap">
  <div class="picker-container">
    <a class="back-link" href="/">&larr; Menu</a>
    <h1>Decks</h1>
    <p class="sub">Select a presentation</p>
    <table>
      <thead><tr><th>Deck</th><th>Slides</th><th></th></tr></thead>
      <tbody id="deck-table"></tbody>
    </table>
  </div>
</div>

<!-- ═══ DECK MODE ═══ -->
<a id="deck-back" href="/sa/deck/" style="display:none;position:fixed;top:16px;left:20px;z-index:200;color:#f4f2ec;font-size:12px;text-decoration:none;opacity:0.7;transition:opacity 0.2s;" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.6'">&larr; Decks</a>

<div class="deck-wrap" id="deck-wrap">
<div id="progress"><div id="progress-fill"></div></div>
<div id="deck"></div>
<div id="nav">
  <button class="nav-btn" id="prev">&larr; Prev</button>
  <div class="dot-row" id="dots"></div>
  <span id="slide-counter"></span>
  <button class="nav-btn" id="next">Next &rarr;</button>
</div>
<div id="hint">&larr; &rarr; arrow keys &middot; click to advance</div>
</div>

<script src="../chart-renderers.js"></script>
<script src="../decks.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   DECK PAGE — picker or presentation based on ?deck= param
   ═══════════════════════════════════════════════════════════════════ */

var deckParam = new URLSearchParams(window.location.search).get('deck');

if (deckParam) {
  /* ── PRESENTATION MODE ── */
  loadDeck(deckParam, function(deckDef) {
    if (!deckDef) { window.location.href = '/sa/deck/'; return; }

    document.getElementById('deck-wrap').classList.add('active');
    document.getElementById('deck-back').style.display = 'block';

    var deckSlides = deckDef.slides;
    var deckEl = document.getElementById('deck');

    deckSlides.forEach(function(slide, i) {
      var div = document.createElement('div');
      div.className = 'slide';
      div.id = 'deck-slide-' + i;
      div.innerHTML =
        '<div class="slide-inner">' +
          '<div class="col-text">' +
            '<div class="eyebrow">' + slide.eyebrow + '</div>' +
            '<h2 class="slide-title">' + slide.title + '</h2>' +
            '<ul class="bullets">' + slide.bullets.map(function(b) { return '<li>' + b + '</li>'; }).join('') + '</ul>' +
          '</div>' +
          '<div class="col-chart"><canvas id="deck-canvas-' + i + '"></canvas></div>' +
        '</div>';
      deckEl.appendChild(div);
    });

    var slideEls = document.querySelectorAll('.deck-wrap .slide');
    var total = slideEls.length;
    var current = 0;
    var bulletIndex = 0;
    var chartsBuilt = {};

    function getBullets(el) { return [].slice.call(el.querySelectorAll('.bullets li')); }

    function buildChartIfNeeded(idx) {
      if (chartsBuilt[idx]) return;
      chartsBuilt[idx] = true;
      var slide = deckSlides[idx];
      var canvas = document.getElementById('deck-canvas-' + idx);
      if (slide && slide.buildChart && canvas) slide.buildChart(canvas);
    }

    function showSlide(idx) {
      var prev = slideEls[current];
      prev.classList.remove('active');
      prev.classList.add('exit');
      setTimeout(function() { prev.classList.remove('exit'); }, 450);
      current = idx;
      bulletIndex = 0;
      var s = slideEls[current];
      s.classList.add('active');
      getBullets(s).forEach(function(li) { li.classList.remove('visible'); });
      buildChartIfNeeded(current);
      revealNext(s);
      updateUI();
    }

    function goTo(idx) { if (idx >= 0 && idx < total) showSlide(idx); }

    function revealNext(el) {
      var items = getBullets(el);
      if (bulletIndex < items.length) { items[bulletIndex].classList.add('visible'); bulletIndex++; return true; }
      return false;
    }

    function updateUI() {
      document.getElementById('slide-counter').textContent = (current + 1) + ' / ' + total;
      document.getElementById('prev').disabled = current === 0;
      document.getElementById('next').disabled = current === total - 1;
      document.querySelectorAll('.dot').forEach(function(d, i) { d.classList.toggle('active', i === current); });
      document.getElementById('progress-fill').style.width = (((current + 1) / total) * 100) + '%';
    }

    var dotsEl = document.getElementById('dots');
    for (var i = 0; i < total; i++) {
      (function(idx) {
        var d = document.createElement('div');
        d.className = 'dot' + (idx === 0 ? ' active' : '');
        d.addEventListener('click', function() { goTo(idx); });
        dotsEl.appendChild(d);
      })(i);
    }

    slideEls[0].classList.add('active');
    buildChartIfNeeded(0);
    revealNext(slideEls[0]);
    updateUI();

    deckEl.addEventListener('click', function(e) {
      if (e.target.closest('button, a')) return;
      if (!revealNext(slideEls[current]) && current < total - 1) goTo(current + 1);
    });
    document.getElementById('next').addEventListener('click', function(e) { e.stopPropagation(); if (current < total - 1) goTo(current + 1); });
    document.getElementById('prev').addEventListener('click', function(e) { e.stopPropagation(); if (current > 0) goTo(current - 1); });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); if (!revealNext(slideEls[current]) && current < total - 1) goTo(current + 1); }
      else if (e.key === 'ArrowLeft') { if (current > 0) goTo(current - 1); }
    });
  });
} else {
  /* ── PICKER MODE ── */
  loadDecks(function() {
    document.getElementById('picker-wrap').classList.add('active');

    var tableBody = document.getElementById('deck-table');
    DECK_DATA.forEach(function(deck) {
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td><div class="td-name">' + deck.name + '</div><div class="td-desc">' + deck.description + '</div></td>' +
        '<td><span class="td-count">' + deck.slideCount + ' slides</span></td>' +
        '<td class="td-arrow">&#x203A;</td>';
      tr.addEventListener('click', function() { window.location.href = '?deck=' + deck.id; });
      tableBody.appendChild(tr);
    });
  });
}
</script>
</body>
</html>
