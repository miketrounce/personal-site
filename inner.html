<style>
      /* ── Layout ── */
      .page {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 40px 24px;
        transition: justify-content 0.6s ease;
      }

      .page.expanded {
        justify-content: center;
        gap: 80px;
        padding-left: 10vw;
        padding-right: 10vw;
      }

      /* ── Shared timeline ── */
      .timeline {
        position: relative;
        padding: 0 0 0 32px;
      }

      .timeline::before {
        content: '';
        position: absolute;
        left: 7px;
        top: 8px;
        bottom: 8px;
        width: 2px;
        background: var(--border);
      }

      .timeline-item {
        position: relative;
        padding: 0 0 32px;
        transition: padding 0.6s ease;
      }

      .timeline-item:last-child { padding-bottom: 0; }

      .timeline-item::before {
        content: '';
        position: absolute;
        left: -29px;
        top: 8px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--muted);
        border: 2px solid #2f2c28;
      }

      .timeline-item.now::before {
        background: var(--accent);
        box-shadow: 0 0 8px rgba(129, 182, 76, 0.5);
      }

      .timeline-dates {
        font-size: 0.8rem;
        color: var(--muted);
        font-weight: 700;
        letter-spacing: 0.05em;
        margin: 0;
      }

      .timeline-role {
        font-size: 1.1rem;
        color: var(--text);
        font-weight: 600;
        margin: 2px 0 0;
      }

      .timeline-item.now .timeline-role {
        color: var(--accent);
      }

      @keyframes fadeInUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ── Detail panel (right) ── */
      .detail {
        display: none;
        opacity: 0;
        transform: translateX(40px);
        transition: opacity 0.6s ease 0.3s, transform 0.6s ease 0.3s;
        pointer-events: none;
      }

      .page.expanded .detail {
        display: block;
        opacity: 1;
        transform: translateX(0);
        pointer-events: auto;
      }

      /* ── Backend → Frontend layout ── */
      .detail-grid {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        grid-template-rows: auto auto;
        gap: 16px;
        max-width: 900px;
        align-items: center;
      }

      .grid-backend-1 { grid-row: 1; grid-column: 1; }
      .grid-backend-2 { grid-row: 2; grid-column: 1; }

      .grid-arrows {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        grid-row: 1 / 3;
        grid-column: 2;
        color: var(--muted);
        font-size: 1.2rem;
        opacity: 0;
        animation: fadeInUp 0.4s ease forwards;
        animation-delay: 0.7s;
      }
      .grid-arrows svg { opacity: 0.4; }

      .grid-frontend {
        grid-row: 1 / 3;
        grid-column: 3;
      }

      .grid-box {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        background: linear-gradient(180deg, #3a3632 0%, #2f2c28 100%);
        opacity: 0;
        transform: translateY(12px);
      }

      .page.expanded .grid-box {
        animation: fadeInUp 0.4s ease forwards;
      }

      .page.expanded .grid-box:nth-child(1) { animation-delay: 0.4s; }
      .page.expanded .grid-box:nth-child(3) { animation-delay: 0.6s; }
      .page.expanded .grid-box:nth-child(4) { animation-delay: 0.8s; }

      .grid-box-dates {
        font-size: 0.65rem;
        color: var(--muted);
        font-weight: 700;
        letter-spacing: 0.05em;
        margin: 0 0 4px;
      }

      .grid-box-title {
        font-size: 0.9rem;
        color: var(--text);
        font-weight: 600;
        margin: 0 0 12px;
      }

      .grid-box-role {
        margin-bottom: 10px;
      }

      .grid-box-role:last-child {
        margin-bottom: 0;
      }

      .grid-box.grid-wide {
        grid-column: span 1;
      }

      .grid-wide-inner {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .grid-box-role-dates {
        font-size: 0.6rem;
        color: var(--muted);
        font-weight: 700;
        letter-spacing: 0.05em;
        margin: 0 0 1px;
      }

      .bio-heading {
        font-size: 0.7rem;
        color: var(--text);
        font-weight: 700;
        letter-spacing: 0.06em;
        margin: 0;
      }

      .bio-sub {
        font-size: 0.75rem;
        color: var(--muted);
        line-height: 1.4;
        margin: 2px 0 0;
      }

      .lock-btn:hover {
        color: var(--text);
      }

      /* ── Mobile ── */
      @media (max-width: 768px) {
        .page {
          padding: 32px 20px;
          align-items: flex-start;
          justify-content: center;
          min-height: 100vh;
        }

        .page.expanded {
          flex-direction: column;
          align-items: flex-start;
          justify-content: flex-start;
          gap: 40px;
          padding: 32px 20px;
        }

        .bio-heading {
          font-size: 0.9rem;
        }

        .detail {
          max-width: 100%;
          width: 100%;
        }

        .detail-grid {
          grid-template-columns: 1fr;
        }
        .grid-arrows {
          grid-row: auto;
          grid-column: 1;
          flex-direction: row;
          transform: rotate(90deg);
        }
        .grid-frontend {
          grid-row: auto;
          grid-column: 1;
        }
      }
</style>
