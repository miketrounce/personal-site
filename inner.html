<style>
      /* ── Layout ── */
      .page {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 40px 24px;
        transition: justify-content 0.6s ease;
      }

      .page.expanded {
        justify-content: center;
        gap: 80px;
        padding-left: 10vw;
        padding-right: 10vw;
      }

      /* ── Shared timeline ── */
      .timeline {
        position: relative;
        padding: 0 0 0 32px;
      }

      .timeline::before {
        content: '';
        position: absolute;
        left: 7px;
        top: 8px;
        bottom: 8px;
        width: 2px;
        background: var(--border);
      }

      .timeline-item {
        position: relative;
        padding: 0 0 32px;
        transition: padding 0.6s ease;
      }

      .timeline-item:last-child { padding-bottom: 0; }

      .timeline-item::before {
        content: '';
        position: absolute;
        left: -29px;
        top: 8px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--muted);
        border: 2px solid #2f2c28;
      }

      .timeline-item.now::before {
        background: var(--accent);
        box-shadow: 0 0 8px rgba(129, 182, 76, 0.5);
      }

      .timeline-dates {
        font-size: 0.8rem;
        color: var(--muted);
        font-weight: 700;
        letter-spacing: 0.05em;
        margin: 0;
      }

      .timeline-role {
        font-size: 1.1rem;
        color: var(--text);
        font-weight: 600;
        margin: 2px 0 0;
      }

      .timeline-item.now .timeline-role {
        color: var(--accent);
      }

      @keyframes fadeInUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ── Detail panel (right) ── */
      .detail {
        display: none;
        opacity: 0;
        transform: translateX(40px);
        transition: opacity 0.6s ease 0.3s, transform 0.6s ease 0.3s;
        pointer-events: none;
      }

      .page.expanded .detail {
        display: block;
        opacity: 1;
        transform: translateX(0);
        pointer-events: auto;
      }

      /* ── 2x2 grid ── */
      .detail-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        gap: 16px;
        max-width: 900px;
      }

      .grid-box {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        background: linear-gradient(180deg, #3a3632 0%, #2f2c28 100%);
        opacity: 0;
        transform: translateY(12px);
      }

      .page.expanded .grid-box {
        animation: fadeInUp 0.4s ease forwards;
      }

      .page.expanded .grid-box:nth-child(1) { animation-delay: 0.4s; }
      .page.expanded .grid-box:nth-child(2) { animation-delay: 0.6s; }
      .page.expanded .grid-box:nth-child(3) { animation-delay: 0.8s; }
      .page.expanded .grid-box:nth-child(4) { animation-delay: 1.0s; }

      .grid-box-dates {
        font-size: 0.65rem;
        color: var(--muted);
        font-weight: 700;
        letter-spacing: 0.05em;
        margin: 0 0 4px;
      }

      .grid-box-title {
        font-size: 0.9rem;
        color: var(--text);
        font-weight: 600;
        margin: 0 0 12px;
      }

      .grid-box-role {
        margin-bottom: 10px;
      }

      .grid-box-role:last-child {
        margin-bottom: 0;
      }

      .grid-box.grid-wide {
        grid-column: span 2;
      }

      .grid-wide-inner {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .grid-box-role-dates {
        font-size: 0.6rem;
        color: var(--muted);
        font-weight: 700;
        letter-spacing: 0.05em;
        margin: 0 0 1px;
      }

      .bio-heading {
        font-size: 0.7rem;
        color: var(--text);
        font-weight: 700;
        letter-spacing: 0.06em;
        margin: 0;
      }

      .bio-sub {
        font-size: 0.75rem;
        color: var(--muted);
        line-height: 1.4;
        margin: 2px 0 0;
      }

      .lock-btn:hover {
        color: var(--text);
      }

      /* ── Mobile ── */
      @media (max-width: 768px) {
        .page {
          padding: 32px 20px;
          align-items: flex-start;
          justify-content: center;
          min-height: 100vh;
        }

        .page.expanded {
          flex-direction: column;
          align-items: flex-start;
          justify-content: flex-start;
          gap: 40px;
          padding: 32px 20px;
        }

        .bio-heading {
          font-size: 0.9rem;
        }

        .detail {
          max-width: 100%;
          width: 100%;
        }

        .detail-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
</style>

<main class="page expanded">

        </div>
      </div>

      <div class="grid-box grid-wide" style="min-height:140px;">
        <p class="grid-box-title">Mutual Funds &amp; ETFs</p>
        <div style="display:flex;gap:12px;">
          <a href="http://167.71.130.110/admin/" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border:1px solid var(--border);border-radius:8px;color:#6fb5ff;text-decoration:none;font-size:0.7rem;font-weight:700;letter-spacing:0.06em;transition:border-color 0.15s;">⇆ DATABASE</a>
        </div>
      </div>

      <div class="grid-box grid-wide" style="min-height:140px;">
        <p class="grid-box-title">South Africa</p>
        <div style="display:flex;gap:12px;">
          <a href="/sa/#play" style="display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border:1px solid var(--border);border-radius:8px;color:var(--accent);text-decoration:none;font-size:0.7rem;font-weight:700;letter-spacing:0.06em;transition:border-color 0.15s;">▶ ANALYSIS</a>
          <a href="/sa/#interact" style="display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border:1px solid var(--border);border-radius:8px;color:var(--text);text-decoration:none;font-size:0.8rem;font-weight:600;transition:border-color 0.15s;">⇆ Interact <span style="color:var(--muted);font-weight:400;font-size:0.7rem;">manual</span></a>
        </div>
      </div>

    </div>
    <a class="lock-btn" style="display:inline-block;margin-top:24px;font-size:0.9rem;font-weight:700;color:var(--muted);text-decoration:none;cursor:pointer;transition:color 0.15s;">Lock →</a>
  </div>

</main>

<script>
  var lockBtn = document.querySelector('.lock-btn');
  if (lockBtn) {
    lockBtn.addEventListener('click', function() {
      try { localStorage.removeItem('mt-key'); localStorage.removeItem('mt-key-sa'); } catch(_) {}
      location.reload();
    });
  }
</script>
