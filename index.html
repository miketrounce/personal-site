<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Michael Trounce</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2334312d'/><text x='50' y='68' font-family='Georgia,serif' font-size='52' font-weight='900' fill='%23f4f2ec' text-anchor='middle'>MT</text></svg>">
    <link rel="stylesheet" href="./styles.css" />
    <style>
      /* ── Layout ── */
      .page {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 40px 24px;
        transition: justify-content 0.6s ease;
      }

      .page.expanded {
        justify-content: flex-start;
        gap: 80px;
        padding-left: 10vw;
      }

      /* ── Career timeline (left) ── */
      .career {
        width: 100%;
        max-width: 420px;
        transition: all 0.6s ease;
      }

      .page.expanded .career {
        max-width: 280px;
        flex-shrink: 0;
      }

      .career h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2.4rem;
        font-weight: 900;
        color: var(--text);
        margin: 0 0 48px;
        transition: font-size 0.6s ease;
      }

      .page.expanded .career h1 {
        font-size: 1.6rem;
        margin-bottom: 28px;
      }

      .career .timeline-role,
      .career .timeline-dates {
        transition: font-size 0.6s ease;
      }

      .page.expanded .career .timeline-role {
        font-size: 0.95rem;
      }

      .page.expanded .career .timeline-dates {
        font-size: 0.7rem;
      }

      .page.expanded .career .timeline-item {
        padding-bottom: 20px;
      }

      .page.expanded .career .more-link {
        display: none;
      }

      /* ── Shared timeline ── */
      .timeline {
        position: relative;
        padding: 0 0 0 32px;
      }

      .timeline::before {
        content: '';
        position: absolute;
        left: 7px;
        top: 8px;
        bottom: 8px;
        width: 2px;
        background: var(--border);
      }

      .timeline-item {
        position: relative;
        padding: 0 0 32px;
        transition: padding 0.6s ease;
      }

      .timeline-item:last-child { padding-bottom: 0; }

      .timeline-item::before {
        content: '';
        position: absolute;
        left: -29px;
        top: 8px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--muted);
        border: 2px solid #2f2c28;
      }

      .timeline-item.now::before {
        background: var(--accent);
        box-shadow: 0 0 8px rgba(129, 182, 76, 0.5);
      }

      .timeline-dates {
        font-size: 0.8rem;
        color: var(--muted);
        font-weight: 700;
        letter-spacing: 0.05em;
        margin: 0;
      }

      .timeline-role {
        font-size: 1.1rem;
        color: var(--text);
        font-weight: 600;
        margin: 2px 0 0;
      }

      .timeline-item.now .timeline-role {
        color: var(--accent);
      }

      /* ── Career animation ── */
      .career .timeline-item {
        opacity: 0;
        transform: translateY(16px);
        animation: fadeInUp 0.5s ease forwards;
      }

      .career .timeline-item:nth-child(1) { animation-delay: 0.3s; }
      .career .timeline-item:nth-child(2) { animation-delay: 0.7s; }
      .career .timeline-item:nth-child(3) { animation-delay: 1.1s; }
      .career .timeline-item:nth-child(4) { animation-delay: 1.5s; }

      .more-link {
        display: inline-block;
        margin-top: 48px;
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--muted);
        text-decoration: none;
        opacity: 0;
        animation: fadeInUp 0.5s ease forwards;
        animation-delay: 2s;
        transition: color 0.15s;
        cursor: pointer;
      }

      .more-link:hover {
        color: var(--text);
      }

      @keyframes fadeInUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ── Password input ── */
      .pw-wrap {
        display: none;
        margin-top: 48px;
        opacity: 0;
        animation: fadeInUp 0.4s ease forwards;
      }

      .pw-wrap.visible { display: block; }

      .pw-input {
        background: transparent;
        border: none;
        border-bottom: 2px solid var(--border);
        color: var(--text);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1rem;
        padding: 6px 0;
        outline: none;
        width: 160px;
        letter-spacing: 0.08em;
        caret-color: var(--accent);
        transition: border-color 0.2s;
      }

      .pw-input::placeholder {
        color: var(--muted);
        opacity: 0.5;
        font-size: 0.85rem;
        letter-spacing: 0.02em;
      }

      .pw-input:focus {
        border-color: var(--muted);
      }

      .pw-input.error {
        animation: shake 0.4s ease;
        border-color: #c44;
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-6px); }
        40%, 80% { transform: translateX(6px); }
      }

      /* ── Detail timeline (right) ── */
      .detail {
        max-width: 420px;
        max-height: 80vh;
        display: none;
        flex-direction: column;
        opacity: 0;
        transform: translateX(40px);
        transition: opacity 0.6s ease 0.3s, transform 0.6s ease 0.3s;
        pointer-events: none;
      }

      .check-header {
        flex-shrink: 0;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 16px;
      }

      .detail .checklist {
        overflow-y: auto;
        flex: 1;
        min-height: 0;
        scrollbar-width: thin;
        scrollbar-color: var(--border) transparent;
      }

      .detail .checklist::-webkit-scrollbar {
        width: 4px;
      }

      .detail .checklist::-webkit-scrollbar-track {
        background: transparent;
      }

      .detail .checklist::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }

      .page.expanded .detail {
        display: flex;
        opacity: 1;
        transform: translateX(0);
        pointer-events: auto;
      }

      .detail .timeline-item {
        opacity: 0;
        transform: translateY(16px);
      }

      .page.expanded .detail .timeline-item {
        animation: fadeInUp 0.5s ease forwards;
      }

      /* ── Checklist ── */
      .checklist {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 16px;
      }

      .check-item {
        display: grid;
        grid-template-columns: 20px 1fr;
        gap: 10px;
        align-items: start;
        opacity: 0;
        transform: translateY(12px);
      }

      .page.expanded .check-item {
        animation: fadeInUp 0.4s ease forwards;
      }

      .page.expanded .check-item:nth-child(1) { animation-delay: 0.4s; }
      .page.expanded .check-item:nth-child(2) { animation-delay: 0.6s; }
      .page.expanded .check-item:nth-child(3) { animation-delay: 0.8s; }
      .page.expanded .check-item:nth-child(4) { animation-delay: 1.0s; }
      .page.expanded .check-item:nth-child(5) { animation-delay: 1.2s; }
      .page.expanded .check-item:nth-child(6) { animation-delay: 1.4s; }
      .page.expanded .check-item:nth-child(7) { animation-delay: 1.6s; }

      .check-icon {
        width: 18px;
        height: 18px;
        margin-top: 2px;
      }

      .check-icon.done {
        color: var(--accent);
      }

      .check-icon.pending {
        color: var(--muted);
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }

      .check-date {
        font-size: 0.75rem;
        color: var(--muted);
        font-weight: 700;
        letter-spacing: 0.05em;
        margin: 0;
      }

      .check-text {
        font-size: 1rem;
        color: var(--text);
        font-weight: 600;
        margin: 1px 0 0;
      }

      .check-sub {
        font-size: 0.85rem;
        color: var(--muted);
        margin: 2px 0 0;
      }

      .check-item.done .check-text {
        color: var(--muted);
      }

      .detail-link {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
        transition: color 0.15s;
      }

      .detail-link:hover {
        color: var(--text);
      }

      .tempora-link {
        text-decoration: none;
        transition: opacity 0.15s;
      }

      .tempora-link:hover {
        opacity: 0.7;
      }

      .tempora-img {
        height: 1.1em;
        vertical-align: -0.2em;
        filter: invert(1);
      }

      .logo-inline {
        text-decoration: none;
        font-weight: 900;
        font-family: Georgia, "Times New Roman", serif;
        transition: opacity 0.15s;
      }

      .logo-inline:hover { opacity: 0.7; }

      .km-inline { color: #6fb5ff; }
      .km-inline .k { color: #fff; }

      .tricksy-inline .tri {
        color: #eff3e3;
        font-family: Georgia, "Times New Roman", serif;
        font-style: italic;
        font-weight: 700;
        letter-spacing: -0.04em;
      }

      .tricksy-inline .ck {
        color: #b8d47f;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 900;
        letter-spacing: -0.08em;
        text-transform: lowercase;
      }

      .tricksy-inline .sy {
        color: #efe5cb;
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 900;
        letter-spacing: -0.05em;
      }

      /* ── Mobile ── */
      @media (max-width: 768px) {
        .page {
          padding: 32px 20px;
          align-items: flex-start;
          justify-content: center;
          min-height: 100vh;
        }

        .more-link {
          margin-top: 24px;
          font-size: 1.1rem;
        }

        .pw-wrap { margin-top: 24px; }

        .page.expanded {
          flex-direction: column;
          align-items: flex-start;
          justify-content: flex-start;
          gap: 40px;
          padding: 32px 20px;
        }

        .page.expanded .career {
          max-width: 100%;
        }

        .career h1 {
          font-size: 1.6rem;
          margin-bottom: 20px;
        }

        .timeline-item {
          padding-bottom: 20px;
        }

        .timeline-dates {
          font-size: 0.7rem;
        }

        .page.expanded .career h1 {
          font-size: 1.4rem;
          margin-bottom: 20px;
        }

        .timeline-role {
          font-size: 0.95rem;
        }

        .page.expanded .career .timeline-item {
          padding-bottom: 16px;
        }

        .check-text {
          font-size: 0.9rem;
        }

        .check-date {
          font-size: 0.7rem;
        }

        .detail {
          max-width: 100%;
          width: 100%;
          max-height: 60vh;
        }
      }
    </style>
  </head>
  <body>

    <main class="page" id="page">

      <div class="career">

            <p class="timeline-dates">2007 — 2016</p>
            <p class="timeline-role">Macro &amp; Flows Strategist</p>
          </div>
          <div class="timeline-item">
            <p class="timeline-dates">2016 — 2026</p>
            <p class="timeline-role">Flow Data Entrepreneur</p>

          <div class="timeline-item now">
            <p class="timeline-dates">2026 — ?</p>
            <p class="timeline-role">Strategist / Risk Taker</p>

        <a class="more-link" id="more-btn">More →</a>
        <div class="pw-wrap" id="pw-wrap">
          <input type="password" class="pw-input" id="pw-input" placeholder="password" autocomplete="off" spellcheck="false">
        </div>
      </div>

    <script>
      const page    = document.getElementById('page');
      const moreBtn = document.getElementById('more-btn');
      const pwWrap  = document.getElementById('pw-wrap');
      const pwInput = document.getElementById('pw-input');
      const detail  = document.getElementById('detail');

      // Show password field
      function showPw() {
        moreBtn.style.display = 'none';
        pwWrap.classList.add('visible');
        pwInput.focus();
      }

      // Decrypt + expand
      async function tryDecrypt(password) {
        try {
          const b64  = JSON.parse(document.getElementById('encrypted-data').textContent);
          const raw  = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
          const salt = raw.slice(0, 16);
          const iv   = raw.slice(16, 28);
          const tag  = raw.slice(28, 44);
          const ct   = raw.slice(44);

          // Derive key with PBKDF2
          const enc   = new TextEncoder();
          const keyMat = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
          const key    = await crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
            keyMat,
            { name: 'AES-GCM', length: 256 },
            false,
            ['decrypt']
          );

          // AES-GCM expects ciphertext + tag concatenated
          const combined = new Uint8Array(ct.length + tag.length);
          combined.set(ct);
          combined.set(tag, ct.length);

          const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, combined);
          const html  = new TextDecoder().decode(plain);

          // Inject + expand
          detail.innerHTML = html;
          pwWrap.classList.remove('visible');
          pwWrap.style.display = 'none';
          page.classList.add('expanded');
        } catch (e) {
          // Wrong password
          pwInput.classList.add('error');
          pwInput.value = '';
          setTimeout(() => pwInput.classList.remove('error'), 500);
        }
      }

      moreBtn.addEventListener('click', showPw);

      pwInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && pwInput.value) {
          tryDecrypt(pwInput.value);
        }
      });

      // Any key still triggers the password prompt (unless already expanded)
      document.addEventListener('keydown', function(e) {
        if (!e.ctrlKey && !e.metaKey && !e.altKey && !page.classList.contains('expanded')) {
          showPw();
        }
      }, { once: true });
    </script>
