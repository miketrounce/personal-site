<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Michael Trounce</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2334312d'/><text x='50' y='68' font-family='Georgia,serif' font-size='52' font-weight='900' fill='%23f4f2ec' text-anchor='middle'>MT</text></svg>">
    <link rel="stylesheet" href="./styles.css" />
    <style>
      /* ── Layout ── */
      .page {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 40px 24px;
      }

      /* ── Career timeline ── */
      .career {
        width: 100%;
        max-width: 420px;
      }

      .career h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2.4rem;
        font-weight: 900;
        color: var(--text);
        margin: 0 0 48px;
      }

      /* ── Shared timeline ── */
      .timeline {
        position: relative;
        padding: 0 0 0 32px;
      }

      .timeline::before {
        content: '';
        position: absolute;
        left: 7px;
        top: 8px;
        bottom: 8px;
        width: 2px;
        background: var(--border);
      }

      .timeline-item {
        position: relative;
        padding: 0 0 32px;
        transition: padding 0.6s ease;
      }

      .timeline-item:last-child { padding-bottom: 0; }

      .timeline-item::before {
        content: '';
        position: absolute;
        left: -29px;
        top: 8px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--muted);
        border: 2px solid #2f2c28;
      }

      .timeline-item.now::before {
        background: var(--accent);
        box-shadow: 0 0 8px rgba(129, 182, 76, 0.5);
      }

      .timeline-dates {
        font-size: 0.8rem;
        color: var(--muted);
        font-weight: 700;
        letter-spacing: 0.05em;
        margin: 0;
      }

      .timeline-role {
        font-size: 1.1rem;
        color: var(--text);
        font-weight: 600;
        margin: 2px 0 0;
      }

      .timeline-item.now .timeline-role {
        color: var(--accent);
      }

      /* ── Career animation ── */
      .career .timeline-item {
        opacity: 0;
        transform: translateY(16px);
        animation: fadeInUp 0.5s ease forwards;
      }

      .career .timeline-item:nth-child(1) { animation-delay: 0.3s; }
      .career .timeline-item:nth-child(2) { animation-delay: 0.7s; }
      .career .timeline-item:nth-child(3) { animation-delay: 1.1s; }
      .career .timeline-item:nth-child(4) { animation-delay: 1.5s; }

      @keyframes fadeInUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ── Mobile ── */
      @media (max-width: 768px) {
        .page {
          padding: 32px 20px;
          align-items: flex-start;
          justify-content: center;
          min-height: 100vh;
        }

        .career h1 {
          font-size: 1.6rem;
          margin-bottom: 20px;
        }

        .timeline-item {
          padding-bottom: 20px;
        }

        .timeline-dates {
          font-size: 0.7rem;
        }

        .timeline-role {
          font-size: 0.95rem;
        }
      }
    </style>
  </head>
  <body>

    <main class="page" id="page">

      <!-- Career timeline -->
      <div class="career">
        <h1>Mike Trounce</h1>

        <div class="timeline">
          <div class="timeline-item">
            <p class="timeline-dates">1998 — 2007</p>
            <p class="timeline-role">Macro Strategist (DM)</p>
          </div>
          <div class="timeline-item">
            <p class="timeline-dates">2007 — 2016</p>
            <p class="timeline-role">Flows Strategist (EM)</p>
          </div>
          <div class="timeline-item">
            <p class="timeline-dates">2016 — 2026</p>
            <p class="timeline-role">Flow Data Entrepreneur</p>
          </div>
        </div>
      </div>

    </main>

  </body>
</html>
