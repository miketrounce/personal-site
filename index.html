<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Michael Trounce</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2334312d'/><text x='50' y='68' font-family='Georgia,serif' font-size='52' font-weight='900' fill='%23f4f2ec' text-anchor='middle'>MT</text></svg>">
    <link rel="stylesheet" href="./styles.css" />
    <style>
      /* ── Layout ── */
      .page {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 40px 24px;
        transition: justify-content 0.6s ease;
      }

      /* ── Career timeline ── */
      .career {
        width: 100%;
        max-width: 420px;
      }

      .career h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2.4rem;
        font-weight: 900;
        color: var(--text);
        margin: 0 0 48px;
      }

      /* ── Shared timeline ── */
      .timeline {
        position: relative;
        padding: 0 0 0 32px;
      }

      .timeline::before {
        content: '';
        position: absolute;
        left: 7px;
        top: 8px;
        bottom: 8px;
        width: 2px;
        background: var(--border);
      }

      .timeline-item {
        position: relative;
        padding: 0 0 32px;
        transition: padding 0.6s ease;
      }

      .timeline-item:last-child { padding-bottom: 0; }

      .timeline-item::before {
        content: '';
        position: absolute;
        left: -29px;
        top: 8px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--muted);
        border: 2px solid #2f2c28;
      }

      .timeline-item.now::before {
        background: var(--accent);
        box-shadow: 0 0 8px rgba(129, 182, 76, 0.5);
      }

      .timeline-dates {
        font-size: 0.8rem;
        color: var(--muted);
        font-weight: 700;
        letter-spacing: 0.05em;
        margin: 0;
      }

      .timeline-role {
        font-size: 1.1rem;
        color: var(--text);
        font-weight: 600;
        margin: 2px 0 0;
      }

      .timeline-item.now .timeline-role {
        color: var(--accent);
      }

      /* ── Career animation ── */
      .career .timeline-item {
        opacity: 0;
        transform: translateY(16px);
        animation: fadeInUp 0.5s ease forwards;
      }

      .career .timeline-item:nth-child(1) { animation-delay: 0.3s; }
      .career .timeline-item:nth-child(2) { animation-delay: 0.7s; }
      .career .timeline-item:nth-child(3) { animation-delay: 1.1s; }
      .career .timeline-item:nth-child(4) { animation-delay: 1.5s; }

      @keyframes fadeInUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ── Unlock input ── */
      .pw-wrap {
        display: none;
        margin-top: 48px;
        opacity: 0;
        animation: fadeInUp 0.4s ease forwards;
      }

      .pw-wrap.visible { display: block; }

      .pw-input {
        background: transparent;
        border: none;
        border-bottom: 2px solid var(--border);
        color: var(--text);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1rem;
        padding: 6px 0;
        outline: none;
        width: 260px;
        letter-spacing: 0.08em;
        caret-color: var(--accent);
        transition: border-color 0.2s;
      }

      .pw-input::placeholder {
        color: var(--muted);
        opacity: 0.5;
        font-size: 0.85rem;
        letter-spacing: 0.02em;
      }

      .pw-input:focus {
        border-color: var(--muted);
      }

      .pw-input.error {
        animation: shake 0.4s ease;
        border-color: #c44;
      }

      .pw-hint {
        font-size: 0.7rem;
        color: var(--muted);
        opacity: 0.4;
        margin: 8px 0 0;
        line-height: 1.4;
      }

      .pw-status {
        font-size: 0.8rem;
        font-weight: 600;
        margin: 10px 0 0;
        opacity: 0;
        transition: opacity 0.3s;
      }

      .pw-status.visible {
        opacity: 1;
      }

      .pw-status.success {
        color: var(--accent);
      }

      .pw-status.error {
        color: #c44;
      }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-6px); }
        40%, 80% { transform: translateX(6px); }
      }

      /* ── Crossfade transition ── */
      .page.fading-out {
        animation: fadeOut 0.6s ease forwards;
      }

      @keyframes fadeOut {
        to { opacity: 0; }
      }

      /* ── Inner page (post-password) ── */
      .inner-landing {
        display: none;
        min-height: 100vh;
        opacity: 0;
        animation: fadeInUp 0.8s ease 0.3s forwards;
      }

      .inner-landing.visible {
        display: block;
      }

      .inner-page {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .inner-greeting {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2.8rem;
        font-weight: 900;
        color: var(--text);
        opacity: 0;
        animation: fadeInUp 0.6s ease 0.5s forwards;
      }

      .inner-name {
        font-size: 1rem;
        color: var(--muted);
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0;
        animation: fadeInUp 0.5s ease 0.9s forwards;
      }

      .inner-pulse {
        width: 40px;
        height: 2px;
        background: var(--accent);
        border-radius: 1px;
        margin: 8px 0;
        opacity: 0;
        animation: fadeInUp 0.5s ease 1.2s forwards, breathe 3s ease-in-out 1.7s infinite;
      }

      @keyframes breathe {
        0%, 100% { opacity: 0.4; transform: scaleX(1); }
        50% { opacity: 1; transform: scaleX(1.5); }
      }

      .inner-msg {
        font-size: 1rem;
        color: var(--muted);
        font-weight: 400;
        opacity: 0;
        animation: fadeInUp 0.5s ease 1.5s forwards;
      }

      /* ── Mobile ── */
      @media (max-width: 768px) {
        .page {
          padding: 32px 20px;
          align-items: flex-start;
          justify-content: center;
          min-height: 100vh;
        }

        .pw-wrap { margin-top: 24px; }

        .career h1 {
          font-size: 1.6rem;
          margin-bottom: 20px;
        }

        .timeline-item {
          padding-bottom: 20px;
        }

        .timeline-dates {
          font-size: 0.7rem;
        }

        .timeline-role {
          font-size: 0.95rem;
        }

        .inner-greeting {
          font-size: 2rem;
        }
      }
    </style>
  </head>

    <!-- Inner landing (shown after decrypt) -->
    <div class="inner-landing" id="inner-landing"></div>

    </main>

    <script>
      const page     = document.getElementById('page');
      const pwInput  = document.getElementById('pw-input');
      const inner    = document.getElementById('inner-landing');
      const pwHint   = document.getElementById('pw-hint');
      const pwStatus = document.getElementById('pw-status');

      // ── HubSpot config ──
      const HUBSPOT_PORTAL_ID = '5848423';
      const HUBSPOT_FORM_GUID = '79391f64-6994-4465-82bd-bbb1910dfda9';

      function isEmail(v)  { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
      function isPhone(v)  { return v.replace(/[^\d]/g, '').length >= 7; }

      function showStatus(msg, type) {
        pwStatus.textContent = msg;
        pwStatus.className = 'pw-status visible ' + type;
        if (type === 'success') {
          pwHint.style.display = 'none';
        }
      }

      async function tryDecrypt(password) {
        const b64  = JSON.parse(document.getElementById('encrypted-data').textContent);
        const raw  = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        const salt = raw.slice(0, 16);
        const iv   = raw.slice(16, 28);
        const tag  = raw.slice(28, 44);
        const ct   = raw.slice(44);

        const enc    = new TextEncoder();
        const keyMat = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
        const key    = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
          keyMat,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );

        const combined = new Uint8Array(ct.length + tag.length);
        combined.set(ct);
        combined.set(tag, ct.length);

        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, combined);
        const html  = new TextDecoder().decode(plain);

        page.classList.add('fading-out');
        setTimeout(() => {
          page.style.display = 'none';
          inner.innerHTML = html;
          inner.classList.add('visible');
          // Scripts inserted via innerHTML don't execute — re-create them
          inner.querySelectorAll('script').forEach(old => {
            const s = document.createElement('script');
            s.textContent = old.textContent;
            old.replaceWith(s);
          });
        }, 600);
      }

      async function submitContact(value) {
        const fieldName = isEmail(value) ? 'email' : 'phone';
        const url = `https://api.hsforms.com/submissions/v3/integration/submit/${HUBSPOT_PORTAL_ID}/${HUBSPOT_FORM_GUID}`;

        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fields: [{ name: fieldName, value: value }]
          })
        });

        if (!res.ok) throw new Error('Submit failed');
      }

      async function handleUnlock(value) {
        // 1. Try password decryption first
        try {
          await tryDecrypt(value);
          return;
        } catch (_) {}

        // 2. Not a valid password. Check if it's a contact request.
        if (isEmail(value) || isPhone(value)) {
          pwInput.disabled = true;
          try {
            await submitContact(value);
            pwInput.value = '';
            showStatus('Request sent. Mike will be in touch.', 'success');
          } catch (_) {
            pwInput.disabled = false;
            showStatus('Something went wrong. Try again.', 'error');
          }
          return;
        }

        // 3. Not a password, email, or phone. Shake it off.
        pwInput.classList.add('error');
        pwInput.value = '';
        setTimeout(() => pwInput.classList.remove('error'), 500);
      }

      pwInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && pwInput.value.trim()) {
          handleUnlock(pwInput.value.trim());
        }
      });
    </script>
