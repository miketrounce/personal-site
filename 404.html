<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not Found</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2334312d'/><text x='50' y='68' font-family='Georgia,serif' font-size='52' font-weight='900' fill='%23f4f2ec' text-anchor='middle'>MT</text></svg>">
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .nf {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 40px 24px;
        text-align: center;
      }
      .nf h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2.4rem;
        font-weight: 900;
        color: var(--text);
        margin: 0 0 12px;
      }
      .nf p {
        font-size: 0.9rem;
        color: var(--muted);
        margin: 0 0 24px;
      }
      .nf a {
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--muted);
        text-decoration: none;
        transition: color 0.15s;
      }
      .nf a:hover { color: var(--text); }
    </style>
  </head>
  <body>
    <main class="nf">
      <h1>Not Found</h1>
      <p>That page doesn't exist.</p>
      <a href="/">← miketrounce.com</a>
    </main>
  </body>
</html>
