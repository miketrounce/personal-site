<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Online Organisation | Michael Trounce</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2334312d'/><text x='50' y='68' font-family='Georgia,serif' font-size='52' font-weight='900' fill='%23f4f2ec' text-anchor='middle'>MT</text></svg>">
    <link rel="stylesheet" href="../../styles.css" />
    <style>
      .dashboard {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 0;
        width: min(100%, 1200px);
        min-height: 100vh;
        margin: 0 auto;
        padding: 22px 24px;
      }

      .sidebar {
        border: 1px solid var(--border);
        border-radius: 24px 0 0 24px;
        background: var(--panel);
        padding: 28px 20px;
        border-right: none;
      }

      .sidebar-title {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 0.85rem;
        font-weight: 700;
        color: var(--text);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin: 0 0 18px;
      }

      .sidebar nav {
        display: grid;
        gap: 4px;
      }

      .sidebar nav a {
        display: block;
        padding: 10px 14px;
        border-radius: 10px;
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--muted);
        transition: background 0.15s, color 0.15s;
      }

      .sidebar nav a:hover {
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
      }

      .sidebar nav a.active {
        background: rgba(129, 182, 76, 0.1);
        color: var(--accent);
        font-weight: 700;
      }

      .sidebar .back-link {
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
      }

      .sidebar .back-link a {
        font-size: 0.8rem;
        color: var(--muted);
        padding: 8px 14px;
      }

      .content {
        border: 1px solid var(--border);
        border-radius: 0 24px 24px 0;
        background: linear-gradient(180deg, #3b3833 0%, #2f2c28 100%);
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
        padding: 40px;
        overflow-y: auto;
      }

      @media (max-width: 768px) {
        .dashboard {
          grid-template-columns: 1fr;
          padding: 14px;
        }

        .sidebar {
          border-radius: 24px 24px 0 0;
          border-right: 1px solid var(--border);
          border-bottom: none;
        }

        .content {
          border-radius: 0 0 24px 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="dashboard">
      <aside class="sidebar">
        <p class="sidebar-title">Online Organisation</p>
        <nav>
          <a href="./" class="active">Overview</a>
          <a href="./github/">GitHub</a>
          <a href="./personal-website/">Personal Website</a>
          <a href="./knowledge-machines/">Knowledge Machines</a>
          <a href="./tricksy/">Tricksy</a>
        </nav>
        <div class="back-link">
          <a href="../">← About</a>
        </div>
      </aside>

      <section class="content">
        <p class="eyebrow">Online Organisation</p>
        <h1>Overview</h1>

        <p>
          This section covers how my online presence is organised — where
          code lives, how sites are hosted, and how everything connects.
        </p>

        <p style="margin-top:28px;font-size:0.8rem;color:var(--muted);font-style:italic;">Last updated: March 2026</p>
      </section>
    </main>
  </body>
</html>
